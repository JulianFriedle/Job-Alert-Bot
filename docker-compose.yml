# Two services from one image, sharing the SQLite data volume:
#   • gui       — the web dashboard (operator logs in, manages clients)
#   • scheduler — the hourly cron pipeline across all enabled clients
# SQLite WAL + busy_timeout (see src/database.js) makes concurrent access safe.

services:
  gui:
    build: .
    image: job-alert-bot
    container_name: job-alert-gui
    restart: unless-stopped
    command: ["node", "src/server.js"]
    ports:
      - "3000:3000"          # put NGINX + Authelia in front of this
    environment:
      JOBS_DB_PATH: /app/data/jobs.db
      GUI_PORT: "3000"
      # ── Operator login (SaaS) ──
      AUTH_ENABLED: "true"
      OPERATOR_USER: "${OPERATOR_USER:-admin}"
      OPERATOR_PASSWORD_HASH: "${OPERATOR_PASSWORD_HASH}"   # npm run hash-password -- "<pw>"
      SESSION_SECRET: "${SESSION_SECRET}"                   # stable random string
      # ── Shared keys (one for all clients) ──
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      ANALYZER_MODEL: "${ANALYZER_MODEL:-claude-haiku-4-5}"
      COVER_LETTER_MODEL: "${COVER_LETTER_MODEL:-claude-opus-5}"
      # Auto-apply: the GUI encrypts credentials on save — the key must match
      # the scheduler's so both read/write the same rows.
      CREDENTIALS_KEY: "${CREDENTIALS_KEY}"
    volumes:
      - ./data:/app/data

  scheduler:
    build: .
    image: job-alert-bot
    container_name: job-alert-scheduler
    restart: unless-stopped
    command: ["node", "index.js"]   # startScheduler() → hourly runAll()
    environment:
      JOBS_DB_PATH: /app/data/jobs.db
      CRON_SCHEDULE: "${CRON_SCHEDULE:-0 * * * *}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      ANALYZER_MODEL: "${ANALYZER_MODEL:-claude-haiku-4-5}"
      COVER_LETTER_MODEL: "${COVER_LETTER_MODEL:-claude-opus-5}"
      # ── Auto-apply (worker + interactive Telegram bot live in THIS service) ──
      AUTO_APPLY_ENABLED: "${AUTO_APPLY_ENABLED:-false}"
      CREDENTIALS_KEY: "${CREDENTIALS_KEY}"
      APPLY_DRY_RUN: "${APPLY_DRY_RUN:-true}"
      APPLY_DAILY_CAP: "${APPLY_DAILY_CAP:-10}"
      APPLY_COOLDOWN_MINUTES: "${APPLY_COOLDOWN_MINUTES:-15}"
    volumes:
      - ./data:/app/data
