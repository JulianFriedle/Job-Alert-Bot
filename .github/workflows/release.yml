# Release: push a version tag (npm version patch|minor|major && git push --follow-tags),
# or start it by hand (Actions → Release → Run workflow, on main): it then
# releases the version in package.json and creates the tag v<version> itself.
# Either way this workflow
#   1. runs the tests,
#   2. builds the Docker image and pushes it to ghcr.io (linux/amd64 + arm64),
#   3. builds the desktop installers on macOS, Windows and Linux,
#   4. creates the GitHub release with all installers + the latest*.yml files
#      the desktop app's updater reads.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The tag must match package.json — the installers and the updater take
      # their version from package.json, the release from the tag. A manual
      # start releases main only, and only a version that isn't released yet.
      - name: Determine and check the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$TAG" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME passt nicht zur package.json-Version $TAG"
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manuelle Releases nur von main (gestartet auf $GITHUB_REF)"
              exit 1
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::$TAG ist schon veröffentlicht – erst die Version in package.json erhöhen"
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # --ignore-scripts: see the Dockerfile; it also skips Electron's binary
      # download, which neither the tests nor electron-builder need.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.test.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.test.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        env:
          # No build-record artifact — the release job only wants installers.
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # --publish never: only build here; the release job uploads everything at once.
      - run: npx electron-builder --publish never
        env:
          # Unsigned for now — don't let electron-builder go looking for certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: [test, docker, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the installers: build-push-action also stores a build record as an
      # artifact, and downloading that one failed the release once.
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      # --target creates the tag on this commit when it doesn't exist yet
      # (manual start); for a pushed tag it is already there.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.test.outputs.tag }}
        run: |
          ls -la artifacts
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest
